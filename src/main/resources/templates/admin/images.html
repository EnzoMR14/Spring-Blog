<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<section class="section section-alt">
    <div class="container">
        <h2 class="section-title">Gestión de imágenes</h2>

        <div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <!-- Formulario de subida -->
        <div class="form-card mb-5">
            <h4 class="mb-3">Subir nueva imagen</h4>
            <form th:action="@{/admin/images}" method="post" enctype="multipart/form-data" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="title" class="form-label">Título</label>
                    <input type="text" id="title" name="title" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label for="file" class="form-label">Archivo</label>
                    <input type="file" id="file" name="file" class="form-control" accept="image/*" required>
                </div>
                <div class="col-md-2">
                    <div class="form-check">
                        <input type="checkbox" id="inCarousel" name="inCarousel" value="true" class="form-check-input">
                        <label for="inCarousel" class="form-check-label">En portada</label>
                    </div>
                </div>
                <div class="col-md-2 d-grid">
                    <button type="submit" class="btn btn-accent">Subir</button>
                </div>
            </form>
        </div>

        <!-- Listado -->
        <p class="text-muted" th:if="${#lists.isEmpty(images)}">Todavía no hay imágenes.</p>

        <div class="row g-4">
            <div class="col-sm-6 col-lg-3" th:each="img : ${images}">
                <div class="card h-100">
                    <img th:src="@{'/uploads/' + ${img.fileName}}" class="card-img-top"
                         style="height:180px; object-fit:cover;" th:alt="${img.title}">
                    <div class="card-body">
                        <h6 class="card-title" th:text="${img.title}">Título</h6>
                        <span class="badge text-bg-success" th:if="${img.inCarousel}">En portada</span>
                        <span class="badge text-bg-secondary" th:unless="${img.inCarousel}">Oculta</span>
                    </div>
                    <div class="card-footer d-flex gap-2">
                        <form th:action="@{'/admin/images/' + ${img.id} + '/carousel'}" method="post">
                            <button type="submit" class="btn btn-outline-secondary btn-sm"
                                    th:text="${img.inCarousel} ? 'Quitar de portada' : 'Poner en portada'">Cambiar</button>
                        </form>
                        <form th:action="@{'/admin/images/' + ${img.id} + '/delete'}" method="post"
                              onsubmit="return confirm('¿Eliminar esta imagen?')">
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
