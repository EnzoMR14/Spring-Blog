<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<section class="section section-alt">
    <div class="container" style="max-width: 520px;">
        <h2 class="section-title">Crear cuenta</h2>
        <div class="form-card">
            <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="row g-3">
                <div class="col-12">
                    <label for="name" class="form-label">Nombre</label>
                    <input type="text" id="name" class="form-control" th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="col-12">
                    <label for="email" class="form-label">Email</label>
                    <input type="text" id="email" class="form-control" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="col-12">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" th:field="*{password}"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <div class="col-12">
                    <label for="confirmPassword" class="form-label">Repite la contraseña</label>
                    <input type="password" id="confirmPassword" class="form-control" th:field="*{confirmPassword}"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>
                <div class="col-12 d-grid">
                    <button type="submit" class="btn btn-accent">Registrarse</button>
                </div>
                <p class="text-center text-muted mb-0">
                    ¿Ya tienes cuenta? <a th:href="@{/login}">Entrar</a>
                </p>
            </form>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
