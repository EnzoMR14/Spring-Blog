<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head}"></head>
  <body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!-- Carrusel de portada -->
    <!-- Portada: carrusel administrable -->
    <header class="hero">
      <!-- Si el admin ha marcado imágenes: carrusel -->
      <div
        id="portada"
        class="carousel slide carousel-fade"
        data-bs-ride="carousel"
        th:if="${!#lists.isEmpty(slides)}"
      >
        <div class="carousel-indicators" th:if="${#lists.size(slides) > 1}">
          <button
            type="button"
            data-bs-target="#portada"
            th:each="s, st : ${slides}"
            th:attr="data-bs-slide-to=${st.index}"
            th:classappend="${st.first} ? 'active'"
          ></button>
        </div>

        <div class="carousel-inner">
          <div
            class="carousel-item"
            th:each="s, st : ${slides}"
            th:classappend="${st.first} ? 'active'"
          >
            <img
              th:src="@{'/uploads/' + ${s.fileName}}"
              class="d-block w-100"
              th:alt="${s.title}"
            />
            <div class="carousel-caption">
              <h1 th:text="${s.title}">Título</h1>
            </div>
          </div>
        </div>

        <th:block th:if="${#lists.size(slides) > 1}">
          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#portada"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#portada"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon"></span>
          </button>
        </th:block>
      </div>

      <!-- Si no hay ninguna imagen en portada: banner por defecto -->
      <div class="hero-fallback text-center" th:if="${#lists.isEmpty(slides)}">
        <div class="container">
          <h1>Historias que merece la pena leer</h1>
          <p class="lead">Ideas, experiencias y novedades en un solo lugar.</p>
          <a th:href="@{/contact}" class="btn btn-accent">Contáctanos</a>
        </div>
      </div>
    </header>

    <!-- Bienvenida -->
    <section class="section">
      <div class="container">
        <h2 class="section-title">Bienvenido</h2>
        <div class="row g-4">
          <div class="col-md-4">
            <div class="feature-card text-center">
              <i class="bi bi-journal-text"></i>
              <h4 class="mt-3">Contenido cuidado</h4>
              <p class="text-muted mb-0">
                Artículos pensados para ser claros y útiles.
              </p>
            </div>
          </div>
          <div class="col-md-4">
            <div class="feature-card text-center">
              <i class="bi bi-people"></i>
              <h4 class="mt-3">Comunidad</h4>
              <p class="text-muted mb-0">Regístrate y forma parte del blog.</p>
            </div>
          </div>
          <div class="col-md-4">
            <div class="feature-card text-center">
              <i class="bi bi-envelope"></i>
              <h4 class="mt-3">Hablemos</h4>
              <p class="text-muted mb-0">
                Escríbenos desde el formulario de contacto.
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
  </body>
</html>
