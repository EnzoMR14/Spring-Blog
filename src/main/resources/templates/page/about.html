<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head}"></head>
  <body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <section class="section">
      <div class="container" style="max-width: 800px">
        <h2 class="section-title">Sobre mí</h2>

        <p class="lead text-center text-muted">
          Escribe aquí una frase que resuma de qué va tu blog.
        </p>

        <div class="row g-4 mt-3">
          <div class="col-md-6">
            <div class="feature-card">
              <i class="bi bi-person"></i>
              <h4 class="mt-3">Quién soy</h4>
              <p class="text-muted mb-0">
                Cuenta quién eres y qué te llevó a crear este blog.
              </p>
            </div>
          </div>
          <div class="col-md-6">
            <div class="feature-card">
              <i class="bi bi-bullseye"></i>
              <h4 class="mt-3">Objetivo</h4>
              <p class="text-muted mb-0">
                Explica qué quieres compartir y para quién.
              </p>
            </div>
          </div>
        </div>

        <div class="text-center mt-5">
          <a th:href="@{/contact}" class="btn btn-accent">Escríbeme</a>
        </div>
      </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
  </body>
</html>
