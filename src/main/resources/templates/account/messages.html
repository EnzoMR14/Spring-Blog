<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <section class="section section-alt">
        <div class="container" style="max-width: 820px;">
            <h2 class="section-title">Mis mensajes</h2>

            <p class="text-muted text-center" th:if="${#lists.isEmpty(messages)}">
                Todavía no has enviado ningún mensaje desde el formulario de contacto.
            </p>

            <div class="feature-card mb-4" th:each="m : ${messages}">
                <div class="d-flex justify-content-between align-items-start">
                    <h5 th:text="${m.subject}">Asunto</h5>
                    <span class="badge text-bg-success" th:if="${m.reply != null}">Respondido</span>
                    <span class="badge text-bg-secondary" th:if="${m.reply == null}">Pendiente</span>
                </div>
                <p class="mt-2" style="white-space: pre-line;" th:text="${m.message}">Mensaje</p>

                <div class="alert alert-light border mb-0" th:if="${m.reply != null}">
                    <strong><i class="bi bi-reply"></i> Respuesta del administrador</strong>
                    <small class="text-muted"
                        th:text="'· ' + ${#temporals.format(m.repliedAt, 'dd/MM/yyyy HH:mm')}">fecha</small>
                    <p class="mb-0 mt-2" style="white-space: pre-line;" th:text="${m.reply}">Respuesta</p>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>

</html>
