<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head}"></head>
  <body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <section class="section section-alt">
      <div class="container" style="max-width: 820px">
        <h2 class="section-title">Blog</h2>

        <p class="text-muted text-center" th:if="${posts.empty}">
          Todavía no hay entradas.
        </p>

        <article class="feature-card mb-4" th:each="p : ${posts.content}">
          <h3>
            <a
              th:href="@{'/blog/' + ${p.id}}"
              th:text="${p.title}"
              class="text-decoration-none"
              style="color: var(--accent)"
              >Título</a
            >
          </h3>
          <p class="text-muted small mb-2">
            <i class="bi bi-person"></i>
            <span th:text="${p.author.name}">Autor</span> ·
            <i class="bi bi-calendar"></i>
            <span th:text="${#temporals.format(p.publishedAt, 'dd/MM/yyyy')}"
              >fecha</span
            >
          </p>
          <p th:text="${#strings.abbreviate(p.content, 220)}">Resumen</p>
          <a th:href="@{'/blog/' + ${p.id}}" class="btn btn-accent btn-sm"
            >Leer más</a
          >
        </article>

        <!-- Paginación -->
        <nav th:if="${posts.totalPages > 1}">
          <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${posts.first} ? 'disabled'">
              <a class="page-link" th:href="@{/blog(page=${posts.number - 1})}"
                >&laquo;</a
              >
            </li>
            <li
              class="page-item"
              th:each="i : ${#numbers.sequence(0, posts.totalPages - 1)}"
              th:classappend="${i == posts.number} ? 'active'"
            >
              <a
                class="page-link"
                th:href="@{/blog(page=${i})}"
                th:text="${i + 1}"
                >1</a
              >
            </li>
            <li class="page-item" th:classappend="${posts.last} ? 'disabled'">
              <a class="page-link" th:href="@{/blog(page=${posts.number + 1})}"
                >&raquo;</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
  </body>
</html>
