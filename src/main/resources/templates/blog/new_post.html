<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head}"></head>
  <body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <section class="section section-alt">
      <div class="container" style="max-width: 760px">
        <h2 class="section-title">Nueva entrada</h2>

        <div class="form-card">
          <form
            th:action="@{/blog/new}"
            th:object="${postForm}"
            method="post"
            class="row g-3"
          >
            <div class="col-12">
              <label for="title" class="form-label">Título</label>
              <input
                type="text"
                id="title"
                class="form-control"
                th:field="*{title}"
                th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
              />
              <div class="invalid-feedback" th:errors="*{title}"></div>
            </div>

            <div class="col-12">
              <label for="content" class="form-label">Contenido</label>
              <textarea
                id="content"
                rows="12"
                class="form-control"
                th:field="*{content}"
                th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"
              ></textarea>
              <div class="invalid-feedback" th:errors="*{content}"></div>
            </div>

            <div class="col-12 text-end">
              <a th:href="@{/blog}" class="btn btn-outline-secondary"
                >Cancelar</a
              >
              <button type="submit" class="btn btn-accent">Publicar</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
  </body>
</html>
