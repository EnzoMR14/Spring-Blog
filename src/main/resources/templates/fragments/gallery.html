<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="card(n, alt)" class="col-xs-12 col-sm-6 col-md-3">
    <div class="sol">
        <img class="img-responsive"
             th:src="@{/images/index/portfolio/{n}.jpg(n=${n})}"
             th:alt="${alt}">
        <div class="behind">
            <div class="head text-center">
                <ul class="list-inline">
                    <li>
                        <a class="gallery"
                           th:href="@{/images/index/gallery/{n}.jpg(n=${n})}"
                           data-toggle="tooltip" data-original-title="Quick View">
                            <i class="fa fa-eye"></i>
                        </a>
                    </li>
                    <li>
                        <a href="#" data-toggle="tooltip" data-original-title="Click if you like it">
                            <i class="fa fa-heart"></i>
                        </a>
                    </li>
                    <li>
                        <a href="#" data-toggle="tooltip" data-original-title="Download">
                            <i class="fa fa-download"></i>
                        </a>
                    </li>
                    <li>
                        <a href="#" data-toggle="tooltip" data-original-title="More information">
                            <i class="fa fa-info"></i>
                        </a>
                    </li>
                </ul>
            </div>
            <div class="row box-content">
                <ul class="list-inline text-center">
                    <li><i class="fa fa-eye"></i> 1000</li>
                    <li><i class="fa fa-heart"></i> 500</li>
                    <li><i class="fa fa-download"></i> 100</li>
                </ul>
            </div>
        </div>
    </div>
</div>

</body>
</html>
