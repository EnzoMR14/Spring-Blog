<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PhotographItem-Responsive Theme</title>

    <link rel="stylesheet" type="text/css" th:href="@{/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/magnific-popup.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/font-awesome/css/font-awesome.min.css}">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-fixed-top navbar-default">
    <div class="container">
        <div class="navbar-header">
            <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#menu">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand page-scroll" href="#page-top"><span>[PHOTO]</span></a>
        </div>
        <div class="collapse navbar-collapse navbar-right" id="menu">
            <ul class="nav navbar-nav">
                <li class="lien"><a th:href="@{/}"><i class="fa fa-home sr-icons"></i> Home</a></li>
                <li class="lien"><a th:href="@{/about}"><i class="fa fa-bookmark sr-icons"></i> About</a></li>
                <li class="lien"><a th:href="@{/blog}"><i class="fa fa-file-text sr-icons"></i> Blog</a></li>
                <li class="lien"><a th:href="@{/contact}"><i class="fa fa-phone-square sr-icons"></i> Contact</a></li>

                <!-- Usuario autenticado -->
                <li class="lien" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-link">
                            <i class="fa fa-sign-out sr-icons"></i>
                            <span sec:authentication="name"></span> - Logout
                        </button>
                    </form>
                </li>
                <li class="lien" sec:authorize="isAuthenticated()">
                    <a th:href="@{/blog/new}"><i class="fa fa-plus-square sr-icons"></i> New post</a>
                </li>

                <!-- Usuario anónimo -->
                <li class="lien" sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}"><i class="fa fa-sign-in sr-icons"></i> Login</a>
                </li>
                <li class="lien" sec:authorize="!isAuthenticated()">
                    <a th:href="@{/register}"><i class="fa fa-user-secret sr-icons"></i> Register</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="home-page">
    <div class="container text-muted text-center">
        <div class="row">
            <ul class="nav col-sm-4">
                <li class="footer-number"><i class="fa fa-phone sr-icons"></i> (00228)92229954</li>
                <li><i class="fa fa-envelope sr-icons"></i> kouvenceslas93@gmail.com</li>
                <li>Photography Fanatic Template &copy; 2017</li>
            </ul>
            <ul class="list-inline social-buttons col-sm-4 col-sm-push-4">
                <li><a href="#"><i class="fa fa-facebook sr-icons"></i></a></li>
                <li><a href="#"><i class="fa fa-twitter sr-icons"></i></a></li>
                <li><a href="#"><i class="fa fa-google-plus sr-icons"></i></a></li>
            </ul>
        </div>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script type="text/javascript" th:src="@{/js/jquery.min.js}"></script>
    <script type="text/javascript" th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
    <script type="text/javascript" th:src="@{/js/jquery.easing.min.js}"></script>
    <script type="text/javascript" th:src="@{/js/jquery.magnific-popup.min.js}"></script>
    <script type="text/javascript" th:src="@{/js/scrollreveal.min.js}"></script>
    <script type="text/javascript" th:src="@{/js/script.js}"></script>
</th:block>

</body>
</html>
